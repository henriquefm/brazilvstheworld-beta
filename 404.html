<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Brasil vs O Mundo</title>
    <script>
      // GitHub Pages only serves real files — a direct visit or refresh on a
      // client-side route (e.g. /spain/area) has no matching file, so GitHub
      // Pages serves this 404 page instead. This redirects back to the app's
      // index.html, encoding the original path so it can be restored there
      // (see the matching script in index.html).
      // Pattern: https://github.com/rafgraph/spa-github-pages
      var path = window.location.pathname + window.location.search + window.location.hash
      window.location.replace('/?redirect=' + encodeURIComponent(path))
    </script>
  </head>
  <body></body>
</html>
